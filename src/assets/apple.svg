<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Apple body gradient -->
    <radialGradient id="appleGradient" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff5252" />
      <stop offset="60%" stop-color="#e53935" />
      <stop offset="100%" stop-color="#b71c1c" />
    </radialGradient>
    <!-- Leaf gradient -->
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81c784" />
      <stop offset="100%" stop-color="#388e3c" />
    </linearGradient>
    <!-- Shadow filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Bottom shadow on the ground -->
  <ellipse cx="32" cy="58" rx="18" ry="4" fill="rgba(0,0,0,0.18)" />

  <g filter="url(#dropShadow)">
    <!-- Stem -->
    <path d="M32 20 C32 12, 38 7, 41 5 C40 8, 36 14, 34 20 Z" fill="#5d4037" />

    <!-- Leaf -->
    <path d="M34 14 C44 11, 49 17, 47 21 C41 23, 36 18, 34 14 Z" fill="url(#leafGradient)" />

    <!-- Apple Body (Classic two-lobed plump shape) -->
    <path d="M32 23 
             C27 18, 14 18, 13 32 
             C12 43, 22 55, 30 55 
             C31.5 55, 32.5 54, 34 54 
             C35.5 54, 36.5 55, 38 55 
             C46 55, 56 43, 55 32 
             C54 18, 41 18, 36 23 
             C34 24.5, 33 24.5, 32 23 Z" 
          fill="url(#appleGradient)" />

    <!-- Glossy Highlight / Reflection -->
    <ellipse cx="23" cy="27" rx="5" ry="8" transform="rotate(-25 23 27)" fill="white" opacity="0.45" />
    <circle cx="21" cy="38" r="2.5" fill="white" opacity="0.3" />
  </g>
</svg>
