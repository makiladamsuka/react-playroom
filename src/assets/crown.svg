<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082" />
      <stop offset="50%" stop-color="#ffb300" />
      <stop offset="100%" stop-color="#ff8f00" />
    </linearGradient>
    <filter id="crownShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#crownShadow)">
    <!-- Crown Base & Spikes -->
    <path d="M10 44 L14 20 L24 32 L32 14 L40 32 L50 20 L54 44 Z" fill="url(#crownGrad)" stroke="#ff6f00" stroke-width="1.5" stroke-linejoin="round" />
    
    <!-- Crown Rim Band -->
    <rect x="10" y="44" width="44" height="8" rx="2" fill="#ffa000" stroke="#ff6f00" stroke-width="1.5" />

    <!-- Jewels / Pearls on Peaks -->
    <circle cx="14" cy="18" r="3" fill="#e91e63" stroke="#c2185b" stroke-width="0.8" />
    <circle cx="32" cy="12" r="4" fill="#00e5ff" stroke="#00b0ff" stroke-width="0.8" />
    <circle cx="50" cy="18" r="3" fill="#e91e63" stroke="#c2185b" stroke-width="0.8" />

    <!-- Jewels on Band -->
    <circle cx="20" cy="48" r="2" fill="#e91e63" />
    <circle cx="32" cy="48" r="2.5" fill="#00e5ff" />
    <circle cx="44" cy="48" r="2" fill="#76ff03" />

    <!-- Sparkle shine -->
    <polygon points="32,20 33,23 36,24 33,25 32,28 31,25 28,24 31,23" fill="white" opacity="0.9" />
  </g>
</svg>
