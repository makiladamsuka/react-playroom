<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <radialGradient id="goldGradient" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff59d" />
      <stop offset="35%" stop-color="#fbc02d" />
      <stop offset="75%" stop-color="#f57f17" />
      <stop offset="100%" stop-color="#e65100" />
    </radialGradient>
    <linearGradient id="goldLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#aed581" />
      <stop offset="100%" stop-color="#689f38" />
    </linearGradient>
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ffd600" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="32" cy="58" rx="18" ry="4" fill="rgba(0,0,0,0.2)" />

  <g filter="url(#goldGlow)">
    <!-- Stem -->
    <path d="M32 20 C32 12, 38 7, 41 5 C40 8, 36 14, 34 20 Z" fill="#4e342e" />

    <!-- Leaf -->
    <path d="M34 14 C44 11, 49 17, 47 21 C41 23, 36 18, 34 14 Z" fill="url(#goldLeaf)" />

    <!-- Golden Apple Body -->
    <path d="M32 23 
             C27 18, 14 18, 13 32 
             C12 43, 22 55, 30 55 
             C31.5 55, 32.5 54, 34 54 
             C35.5 54, 36.5 55, 38 55 
             C46 55, 56 43, 55 32 
             C54 18, 41 18, 36 23 
             C34 24.5, 33 24.5, 32 23 Z" 
          fill="url(#goldGradient)" />

    <!-- Glossy Highlight -->
    <ellipse cx="23" cy="27" rx="5" ry="8" transform="rotate(-25 23 27)" fill="white" opacity="0.6" />
    
    <!-- Sparkles -->
    <path d="M47 18 L48.5 22 L52.5 23.5 L48.5 25 L47 29 L45.5 25 L41.5 23.5 L45.5 22 Z" fill="#ffffff" />
    <path d="M12 38 L13 40 L15 41 L13 42 L12 44 L11 42 L9 41 L11 40 Z" fill="#ffffff" />
  </g>
</svg>
